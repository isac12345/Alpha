name: build
on:
  push:
    branches: [app-control]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Decode keystore (secret yang sama dengan package.yml)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "::add-mask::$KS_B64"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/release.p12"
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: alpha
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          ls -l "$APK"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/aapt" dump badging "$APK" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-APK
          path: app/build/outputs/apk/release/*.apk