name: Build Alpha Control + modul

on:
  push:
    branches: [ main, master, fusion-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK 34 (SDK bawaan runner; setup-android@v3 gagal di repo ini)
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          if ! ls -d "$ANDROID_SDK_ROOT"/platforms/android-34 >/dev/null 2>&1; then
            SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses >/dev/null 2>&1 || true
              "$SDKM" "platforms;android-34" "build-tools;34.0.0" || echo "lanjut pakai SDK yang ada"
            fi
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cek sintaks script modul
        run: bash tools/check_module.sh

      - name: Siapkan keystore dari GitHub Secrets
        env:
          KS_B64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ALPHA_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Secret keystore belum lengkap (ALPHA_KEYSTORE_BASE64, ALPHA_STORE_PASSWORD, ALPHA_KEY_ALIAS, ALPHA_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/alpha.jks"
          {
            echo "ALPHA_KEYSTORE_PATH=$RUNNER_TEMP/alpha.jks"
            echo "ALPHA_STORE_PASSWORD=$KS_PASS"
            echo "ALPHA_KEY_ALIAS=$KS_ALIAS"
            echo "ALPHA_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rakit zip modul (APK ikut di companion/)
        run: |
          VER=$(cat version.txt | tr -d '[:space:]')
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          mkdir -p module/companion
          cp "$APK" module/companion/AlphaBubble.apk
          mkdir -p dist
          cp "$APK" "dist/AlphaControl-v${VER}.apk"
          (cd module && zip -r9 -q "../dist/Alpha-Fusion-v${VER}.zip" . -x '*.git*')
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: alpha-fusion-v${{ github.run_number }}
          path: dist/*
