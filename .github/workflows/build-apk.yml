name: Build APK
on:
  push:
    branches: [REDACTED]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: SDK 34 (pakai SDK bawaan runner, pasang bila kurang)
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          if ! ls -d "$ANDROID_SDK_ROOT"/platforms/android-34 >/dev/null 2>&1; then
            SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses >/dev/null 2>&1 || true
              "$SDKM" "platforms;android-34" "build-tools;34.0.0" || echo "gagal pasang SDK 34, lanjut pakai yang ada"
            else
              echo "sdkmanager tidak ditemukan, hopesake bawaan runner"
            fi
          fi
          ls -d "$ANDROID_SDK_ROOT"/platforms/* 2>/dev/null | tail -3 || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/alpha-release.p12" && ls -l "$RUNNER_TEMP/alpha-release.p12"
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/alpha-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: alpha
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle -p REDACTED :app:assembleRelease --no-daemon
      - name: Verify APK
        run: |
          set -e
          APK=$(ls REDACTED/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          ls -l "$APK"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/aapt" dump badging "$APK" | head -3
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDACTED-apk
          path: REDACTED/app/build/outputs/apk/release/*.apk