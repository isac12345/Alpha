name: Build APK
on:
  push: { branches: [alpha-control] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: SDK platforms + build-tools
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        yes | sdkmanager --licenses || true
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: 8.7 }
    - name: Diagnose AAR / merged res (A)
      run: |
        echo "=== AAR caches ==="
        find ~/.gradle/caches/modules-2 -type f \( -name '*material-1.11.0*.aar' -o -name '*appcompat-1.6.1*.aar' \) 2>/dev/null | head -n 6 || echo "no .aar (AAR belum terunduh / pakai cache)"
        echo "=== exploded-aar ==="
        find ~/.gradle/caches/ -type d -name 'material-1.11.0' 2>/dev/null | head -n 3 || echo "no exploded-aar dir"
        echo "=== merged_res ==="
        ls app/build/intermediates/merged_res/release/ 2>/dev/null | grep -i -E 'material|appcompat' | head -n 6 || echo "merged_res tidak ada / kosong"
    - name: Decode keystore
      env: { KS_B64: ${{ secrets.KEYSTORE_B64 }} }
      run: echo "$KS_B64" | base64 -d > alpha-release.p12
    - name: Build release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/alpha-release.p12
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: alpha
        KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
      run: |
        gradle :alpha-control:app:assembleRelease --no-daemon --project-dir .
    - name: Verify APK
      run: |
        ls -l app/build/outputs/apk/release/*.apk || ls -l app/build/outputs/apk/release/*.apk || echo "apk not at expected path"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with: { name: alpha-control-apk, path: app/build/outputs/apk/release/app-release.apk }
