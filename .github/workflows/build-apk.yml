name: Build APK
on:
  push: { branches: [REDACTED] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - name: SDK platforms (pakai SDK bawaan runner; pasang platform 34 bila kurang)
      run: |
        ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
        if ! ls -d "$ANDROID_SDK_ROOT"/platforms/android-34 >/dev/null 2>&1; then
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] && yes | "$SDKM" --licenses >/dev/null 2>&1; "$SDKM" "platforms;android-34" "build-tools;34.0.0" || echo "SDK 34 tidak bisa dipasang, lanjut pakai yang ada"
        fi
        ls -d "$ANDROID_SDK_ROOT"/platforms/* 2>/dev/null | tail -3
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: 8.7 }
    - name: Decode keystore from secret
      env:
        KS_B64: ${{ secrets.KEYSTORE_B64 }}
      run: |
        echo "$KS_B64" | base64 -d > alpha-release.p12
    - name: Build release APK (gradlew tidak tersedia di runner; pakai gradle langsung)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/alpha-release.p12
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: alpha
        KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
      run: gradle :app:assembleRelease --no-daemon
    - name: Verify APK
      run: |
        cd REDACTED && ls -l app/build/outputs/apk/release/*.apk
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with: { name: REDACTED-apk, path: REDACTED/app/build/outputs/apk/release/*.apk }
