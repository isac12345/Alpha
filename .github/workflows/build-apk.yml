name: Build APK
on:
  push:
    branches: [alpha-control]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: SDK 34 (pakai SDK bawaan runner, pasang bila kurang)
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          if ! ls -d "$ANDROID_SDK_ROOT"/platforms/android-34 >/dev/null 2>&1; then
            SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses >/dev/null 2>&1 || true
              "$SDKM" "platforms;android-34" "build-tools;34.0.0" || echo "gagal pasang SDK 34, lanjut pakai yang ada"
            else
              echo "sdkmanager tidak ditemukan, hopesake bawaan runner"
            fi
          fi
          ls -d "$ANDROID_SDK_ROOT"/platforms/* 2>/dev/null | tail -3 || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK (unsigned)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle -p alpha-control :app:assembleRelease --no-daemon
      - name: Align + sign (apksigner, sama seperti package.yml)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "::add-mask::$KS_PASS"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          IN=$(ls alpha-control/app/build/outputs/apk/release/*unsigned*.apk | head -1)
          echo "unsigned: $IN"
          "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/alpha-release.p12"
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/alpha-release.p12" --ks-type PKCS12 \
            --ks-pass env:KS_PASS --ks-key-alias alpha --key-pass env:KS_PASS \
            --out alpha-control/app/build/outputs/apk/release/AlphaBubble-signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP/alpha-release.p12"
      - name: Verify APK
        run: |
          set -e
          APK=alpha-control/app/build/outputs/apk/release/AlphaBubble-signed.apk
          test -f "$APK" || { echo 'APK signed tidak ada'; exit 1; }
          echo "APK: $APK"
          ls -l "$APK"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/aapt" dump badging "$APK" | head -3
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-control-apk
          path: alpha-control/app/build/outputs/apk/release/AlphaBubble-signed.apk