name: Decode APK (read-only reference)
# Decode companion/AlphaBubble.apk TANPA rebuild/sign — hasil untuk analisis
# smali+resources sebagai acuan (APK lebih baru dari source tag).
# NOTE: workflow_dispatch 404 bila file tidak ada di default branch (master) —
# sampai ada di master, run lewat push ke fusion-v2.
on:
  push:
    branches: [ "fusion-v2" ]
    paths: [ ".github/workflows/decode.yml" ]
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install apktool (latest release, into work/)
        run: |
          set -e
          mkdir -p work/tools
          TAG=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r .tag_name)
          echo "apktool tag: $TAG"
          VER=${TAG#v}
          curl -L -o work/tools/apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/${TAG}/apktool_${VER}.jar"
          curl -L -o work/tools/apktool "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool"
          chmod +x work/tools/apktool
          ./work/tools/apktool --version
      - name: Decode APK (original untouched, no rebuild)
        run: |
          set -e
          ./work/tools/apktool d companion/AlphaBubble.apk -o work/decode -f
          echo "--- decode tree ---"
          ls work/decode
          echo "--- apktool.yml version ---"
          grep -E "versionCode|versionName|package" work/decode/apktool.yml | head -5
      - name: Upload decode tree
        uses: actions/upload-artifact@v4
        with:
          name: AlphaBubble-decoded
          path: work/decode
