name: Edit APK (apktool)
# NOTE: workflow_dispatch butuh file ini ada di default branch (master) —
# GitHub 404 kalau tidak. Sampai ada di master, run lewat push ke fusion-v2.
on:
  push:
    branches: [ "fusion-v2" ]
    paths: [ ".github/workflows/apk-edit.yml", "apk-overlay/**", "companion/AlphaBubble.apk" ]
  workflow_dispatch:
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install apktool (latest release)
        run: |
          set -e
          TAG=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r .tag_name)
          echo "apktool tag: $TAG"
          VER=${TAG#v}
          curl -L -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/${TAG}/apktool_${VER}.jar"
          curl -L -o apktool "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool"
          chmod +x apktool
          ./apktool --version
      - name: Decode APK (original untouched)
        run: |
          set -e
          mkdir -p work
          ./apktool d companion/AlphaBubble.apk -o work/decode -f
      - name: Apply overlay (if any)
        run: |
          set -e
          if [ -d apk-overlay ] && [ -n "$(find apk-overlay -type f ! -name .gitkeep | head -n 1)" ]; then
            rsync -a --exclude=.gitkeep apk-overlay/ work/decode/
            echo "overlay applied"
          else
            echo "overlay empty, nothing changed"
          fi
      - name: Rebuild, align, sign
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "::add-mask::$KS_PASS"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          ./apktool b work/decode -o work/unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -f 4 work/unsigned.apk work/aligned.apk
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-type PKCS12 \
            --ks-pass:env KS_PASS --ks-key-alias alpha --key-pass:env KS_PASS \
            --out work/AlphaBubble-edited.apk work/aligned.apk
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Remove temp keystore (always)
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify signature
        run: |
          set -e
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs work/AlphaBubble-edited.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaBubble-edited
          path: work/AlphaBubble-edited.apk
