name: Package Alpha Fusion ZIP
# NOTE: workflow_dispatch butuh file ini ada di default branch (master).
# Sampai ada di master, run lewat push ke fusion-v2.
on:
  push:
    branches: [ "fusion-v2", "work/*" ]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Version check (version.txt vs companion_install.sh)
        run: |
          set -e
          V=$(tr -cd '0-9' < version.txt)
          [ -n "$V" ] || { echo "version.txt kosong"; exit 1; }
          echo "version.txt: $V"
          echo "V=$V" >> "$GITHUB_ENV"
          grep -q "^ALPHA_COMPANION_VER=${V}$" common/companion_install.sh \
            || { echo "ALPHA_COMPANION_VER != version.txt, samakan dulu"; exit 1; }
      - name: Install apktool (pinned v3.0.3, into work/)
        run: |
          set -e
          mkdir -p work/tools
          TAG="v3.0.3"
          LATEST=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r .tag_name 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then TAG="$LATEST"; fi
          echo "apktool tag: $TAG"
          VER=${TAG#v}
          curl -L -o work/tools/apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/${TAG}/apktool_${VER}.jar"
          curl -L -o work/tools/apktool "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool"
          chmod +x work/tools/apktool
          ./work/tools/apktool --version
      - name: Decode APK (original untouched)
        run: |
          set -e
          mkdir -p work
          ./work/tools/apktool d companion/AlphaBubble.apk -o work/decode -f
      - name: Apply overlay (if any)
        run: |
          set -e
          if [ -d apk-overlay ] && [ -n "$(find apk-overlay -type f ! -name .gitkeep | head -n 1)" ]; then
            rsync -a --exclude=.gitkeep apk-overlay/ work/decode/
            echo "overlay applied"
          else
            echo "overlay empty, nothing changed"
          fi
      - name: Apply smali patches (B1 activeDisplayInfo Override-first)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/RootShell.smali
          echo "sebelum: $(grep -c '(?:Override|Physical)' "$F") pola lama"
          sed -f apk-patches/b1-activeDisplayInfo.sed -i "$F"
          test "$(grep -c 'Override size: |Physical size:' "$F")" = "1" || { echo "patch size gagal"; exit 1; }
          test "$(grep -c 'Override density: |Physical density:' "$F")" = "1" || { echo "patch density gagal"; exit 1; }
          test "$(grep -c '(?:Override|Physical)' "$F")" = "0" || { echo "pola lama masih ada"; exit 1; }
          grep -n 'Override size: |Physical size:\|Override density: |Physical density:' "$F"
          echo "patch B1 OK"
      - name: Apply F2 hook (HideFeedback.buzz, 1 baris)
        run: |
          set -e
          F='work/decode/smali_classes4/com/alphabubble/BubbleService$2$1.smali'
          echo "sebelum: $(grep -c 'HideFeedback' "$F" || true) hook"
          sed -f apk-patches/f2-hidefeedback-hook.sed -i "$F"
          test "$(grep -c 'HideFeedback;->buzz' "$F")" = "1" || { echo "hook F2 gagal"; exit 1; }
          grep -n 'HideFeedback' "$F"
          echo "hook F2 OK"
      - name: Apply B2 notif icon (setSmallIcon -> ic_stat_alpha)
        run: |
          set -e
          F='work/decode/smali_classes4/com/alphabubble/BubbleService.smali'
          echo "sebelum: $(grep -c '0x108009b' "$F") framework icon"
          sed -f apk-patches/b2-notif-icon.sed -i "$F"
          test "$(grep -c '0x7f05001a' "$F")" = "1" || { echo "patch B2 gagal"; exit 1; }
          test "$(grep -c '0x108009b' "$F")" = "0" || { echo "ikon lama masih ada"; exit 1; }
          grep -n '0x7f05001a' "$F"
          echo "patch B2 OK"
      - name: Apply Batch1 HomeCards hooks (onCreate + onResume)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/MainActivity.smali
          echo "sebelum: $(grep -c 'HomeCards' "$F" || true) hook"
          sed -f apk-patches/b8-homecards-hook.sed -i "$F"
          test "$(grep -c 'HomeCards;->attach' "$F")" = "1" || { echo "hook attach gagal"; exit 1; }
          test "$(grep -c 'HomeCards;->refresh' "$F")" = "1" || { echo "hook refresh gagal"; exit 1; }
          test "$(grep -c 'HomeCards;->maybeOnboard' "$F")" = "1" || { echo "hook onboard gagal"; exit 1; }
          grep -n 'HomeCards' "$F"
          echo "hook Batch1 OK"
      - name: Apply Batch2 Tools hooks (dexopt x2 + res confirm)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/MainActivity.smali
          sed -f apk-patches/b9a-dexopt-start.sed -i "$F"
          test "$(grep -c 'ToolsKit;->dexoptStart' "$F")" = "1" || { echo "hook dexoptStart gagal"; exit 1; }
          echo "hook dexoptStart OK"
          F='work/decode/smali_classes3/com/alphabubble/MainActivity$openDexopt$3$1$1$1$1.smali'
          sed -f apk-patches/b9b-dexopt-done.sed -i "$F"
          test "$(grep -c 'ToolsKit;->dexoptDone' "$F")" = "1" || { echo "hook dexoptDone gagal"; exit 1; }
          echo "hook dexoptDone OK"
          F='work/decode/smali_classes3/com/alphabubble/MainActivity$applyResolution$1$1$1.smali'
          sed -f apk-patches/b9c-res-confirm.sed -i "$F"
          test "$(grep -c 'ToolsKit;->confirmKeep' "$F")" = "1" || { echo "hook confirmKeep gagal"; exit 1; }
          echo "hook confirmKeep OK"
      - name: Apply Batch3 hooks (BubbleStyle + DynNotif)
        run: |
          set -e
          F='work/decode/smali_classes4/com/alphabubble/BubbleService.smali'
          sed -f apk-patches/b10a-bubblestyle.sed -i "$F"
          test "$(grep -c 'BubbleStyle;->apply' "$F")" = "1" || { echo "hook style gagal"; exit 1; }
          echo "hook style OK"
          sed -f apk-patches/b10b-dynnotif.sed -i "$F"
          test "$(grep -c 'DynNotif;->refresh' "$F")" = "1" || { echo "hook notif gagal"; exit 1; }
          echo "hook notif OK"
      - name: Apply Fix5 hooks (bg pick + gravity)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/MainActivity.smali
          sed -f apk-patches/b11a-bgpick.sed -i "$F"
          test "$(grep -c 'BgEditor;->handlePick' "$F")" = "1" || { echo "hook bgpick gagal"; exit 1; }
          echo "hook bgpick OK"
          sed -f apk-patches/b11b-bggravity.sed -i "$F"
          test "$(grep -c 'setGravity(I)V' "$F")" = "1" || { echo "hook gravity gagal"; exit 1; }
          echo "hook gravity OK"
          sed -f apk-patches/b25-bgfull.sed -i "$F"
          test "$(grep -c 'BgFull;->apply' "$F")" = "1" || { echo "hook bgfull gagal"; exit 1; }
          echo "hook bgfull OK"
      - name: Apply b16 hooks (card alpha x2 + bubble refresh + dexopt style)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/MainActivity.smali
          sed -f apk-patches/b16a-cardalpha-seekbar.sed -i "$F"
          test "$(grep -c 'CardAlpha;->setupSeekBar' "$F")" = "1" || { echo "hook cardalpha seekbar gagal"; exit 1; }
          sed -f apk-patches/b16b-cardalpha-resume.sed -i "$F"
          test "$(grep -c 'CardAlpha;->applyFromPrefs' "$F")" = "2" || { echo "hook cardalpha resume gagal"; exit 1; }
          sed -f apk-patches/b16d-dexopt-dialog-style.sed -i "$F"
          test "$(grep -c 'ToolsKit;->styleDexoptDialog' "$F")" = "1" || { echo "hook dexopt style gagal"; exit 1; }
          echo "hook b16 MainActivity OK"
          F='work/decode/smali_classes4/com/alphabubble/BubbleService.smali'
          sed -f apk-patches/b16c-bubble-refresh.sed -i "$F"
          test "$(grep -c 'BUBBLE_STYLE_REFRESH' "$F")" = "1" || { echo "hook bubble refresh gagal"; exit 1; }
          echo "hook b16 BubbleService OK"
      - name: Apply b26 hook (bg refresh onResume)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/MainActivity.smali
          sed -f apk-patches/b26-bgrefresh.sed -i "$F"
          test "$(grep -c 'BgFull;->apply' "$F")" = "2" || { echo "hook bgrefresh gagal"; exit 1; }
          echo "hook bgrefresh OK"
      - name: Apply b28 hook (bottom nav attach)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/MainActivity.smali
          sed -f apk-patches/b28-nav.sed -i "$F"
          test "$(grep -c 'NavTabs;->attach' "$F")" = "1" || { echo "hook nav gagal"; exit 1; }
          echo "hook nav OK"
      - name: Apply b31 hook (cold start dashboard)
        run: |
          set -e
          F=work/decode/smali_classes3/com/alphabubble/MainActivity.smali
          sed -f apk-patches/b31-coldstart.sed -i "$F"
          test "$(grep -c 'NavTabs;->showDashboard' "$F")" = "1" || { echo "hook coldstart gagal"; exit 1; }
          echo "hook coldstart OK"
      - name: Patch versionCode from version.txt
        run: |
          set -e
          sed -i -E "s/^(\s*versionCode:).*/\1 $V/" work/decode/apktool.yml
          grep -qE "^[[:space:]]*versionCode: $V$" work/decode/apktool.yml \
            || { echo "patch versionCode gagal"; exit 1; }
          grep -E "versionCode:" work/decode/apktool.yml
      - name: Rebuild unsigned APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "::add-mask::$KS_PASS"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          ./work/tools/apktool b work/decode -o work/unsigned.apk
      - name: Compile extra classes + inject classes5.dex
        run: |
          set -e
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          AJAR=$(ls -d "$ANDROID_SDK_ROOT"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1)
          test -n "$AJAR" || { echo "android.jar tidak ketemu"; exit 1; }
          echo "android.jar: $AJAR"
          mkdir -p work/hf-classes
          javac -source 8 -target 8 -cp "$AJAR" -d work/hf-classes $(find java -name '*.java') 2>&1 | grep -v "bootstrap\|deprecat\|obsolete" || true
          test -f work/hf-classes/com/alphabubble/HideFeedback.class || { echo "javac HideFeedback gagal"; exit 1; }
          test -f work/hf-classes/com/alphabubble/BubbleSettingsActivity.class || { echo "javac BubbleSettingsActivity gagal"; exit 1; }
          test -f work/hf-classes/com/alphabubble/BgEditor.class || { echo "javac BgEditor gagal"; exit 1; }
          test -f work/hf-classes/com/alphabubble/BgFull.class || { echo "javac BgFull gagal"; exit 1; }
          ls work/hf-classes/com/alphabubble/*.class
          mkdir -p work/hf-dex
          "$ANDROID_SDK_ROOT/build-tools/$BT/d8" --min-api 26 --output work/hf-dex/ $(find work/hf-classes -name '*.class')
          test -f work/hf-dex/classes.dex || { echo "d8 gagal"; exit 1; }
          unzip -l work/unsigned.apk | grep -E "classes[0-9]*\.dex"
          test -z "$(unzip -l work/unsigned.apk | grep 'classes5\.dex')" || { echo "classes5.dex sudah ada?!"; exit 1; }
          cp work/hf-dex/classes.dex work/classes5.dex
          (cd work && zip -q unsigned.apk classes5.dex && rm classes5.dex)
          unzip -l work/unsigned.apk | grep -E "classes[0-9]*\.dex"
          echo "inject classes5.dex OK"
      - name: Align + sign
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "::add-mask::$KS_PASS"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -f 4 work/unsigned.apk work/aligned.apk
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-type PKCS12 \
            --ks-pass env:KS_PASS --ks-key-alias alpha --key-pass env:KS_PASS \
            --out work/AlphaBubble-signed.apk work/aligned.apk
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Remove temp keystore (always)
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify APK (cert + versionCode + package)
        run: |
          set -e
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs work/AlphaBubble-signed.apk
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/$BT/aapt" dump badging work/AlphaBubble-signed.apk | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.alphabubble'" || { echo "package salah"; exit 1; }
          CODE=$(echo "$BADGING" | grep -o "versionCode='[0-9]*'" | grep -o "[0-9]*")
          echo "apk versionCode: $CODE (harap $V)"
          [ "$CODE" = "$V" ] || { echo "versionCode APK != version.txt"; exit 1; }
          unzip -l work/AlphaBubble-signed.apk | grep -E "classes[0-9]*\.dex"
          unzip -p work/AlphaBubble-signed.apk classes5.dex > /tmp/hf5.dex
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/HideFeedback;" \
            || { echo "HideFeedback tidak ada di classes5.dex"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/BubbleSettingsActivity;" \
            || { echo "BubbleSettingsActivity tidak ada di classes5.dex"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/HomeCards;" \
            || { echo "HomeCards tidak ada di classes5.dex"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/HelperGuard;" \
            || { echo "HelperGuard tidak ada di classes5.dex"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/ToolsKit;" \
            || { echo "ToolsKit tidak ada di classes5.dex"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/BubbleStyle;" \
            || { echo "BubbleStyle tidak ada di classes5.dex"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/DynNotif;" \
            || { echo "DynNotif tidak ada di classes5.dex"; exit 1; }
          echo "7 kelas di classes5.dex OK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/BgEditor;" \
            || { echo "BgEditor tidak ada di classes5.dex"; exit 1; }
          echo "8 kelas di classes5.dex OK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/BgFull;" \
            || { echo "BgFull tidak ada di classes5.dex"; exit 1; }
          echo "9 kelas di classes5.dex OK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/dexdump" -d /tmp/hf5.dex 2>/dev/null | grep -q "Lcom/alphabubble/CardAlpha;" \
            || { echo "CardAlpha tidak ada di classes5.dex"; exit 1; }
          echo "10 kelas di classes5.dex OK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/aapt" dump xmltree work/AlphaBubble-signed.apk AndroidManifest.xml | grep -q "BubbleSettingsActivity" \
            || { echo "BubbleSettingsActivity tidak ada di manifest"; exit 1; }
          echo "activity di manifest OK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/aapt" dump badging work/AlphaBubble-signed.apk | grep -c "launchable-activity" | grep -q "^1$" \
            || { echo "harus tepat 1 LAUNCHER activity"; exit 1; }
          echo "satu LAUNCHER OK"
          "$ANDROID_SDK_ROOT/build-tools/$BT/aapt" dump resources work/AlphaBubble-signed.apk 2>/dev/null | grep -q "ic_stat_alpha" \
            || { echo "ic_stat_alpha tidak ada di resources"; exit 1; }
          echo "drawable ic_stat_alpha OK"
      - name: Stage module tree (signed APK only in ZIP)
        run: |
          set -e
          rm -rf stage
          mkdir stage
          rsync -a \
            --exclude=.git/ --exclude=.github/ --exclude=.opencode/ \
            --exclude=AGENTS.md --exclude=STATE.md --exclude=PLAN.md --exclude=NOTES.md \
            --exclude=.gitignore \
            --exclude=build-output/ --exclude=work/ --exclude=stage/ \
            --exclude=apk-overlay/ --exclude=apk-patches/ --exclude=java/ --exclude=version.txt --exclude=Alpha-Fusion-v1.zip \
            ./ stage/
          cp work/AlphaBubble-signed.apk stage/companion/AlphaBubble.apk
          test -f stage/module.prop
          test -f stage/META-INF/com/google/android/update-binary
          test -f stage/companion/AlphaBubble.apk
      - name: Build module ZIP (META-INF at root, no wrapper dir)
        run: |
          set -e
          rm -f Alpha-Fusion-v1.zip
          (cd stage && zip -r ../Alpha-Fusion-v1.zip .)
          unzip -l Alpha-Fusion-v1.zip | head -n 20
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Fusion-v1
          path: Alpha-Fusion-v1.zip
      - name: Upload signed APK (test)
        uses: actions/upload-artifact@v4
        with:
          name: AlphaBubble-signed
          path: work/AlphaBubble-signed.apk
