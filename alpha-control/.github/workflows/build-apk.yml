name: Build APK
on:
  push: { branches: [alpha-control] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: SDK platforms + build-tools
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        yes | sdkmanager --licenses || true
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: 8.7 }
    - name: Decode keystore from secret
      env: { KS_B64: ${{ secrets.KEYSTORE_B64 }} }
      run: |
        echo "$KS_B64" | base64 -d > alpha-release.p12
    - name: Build release APK (gradlew tidak tersedia di runner; pakai gradle langsung)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/alpha-release.p12
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: alpha
        KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
      run: |
        ./gradlew :app:assembleRelease --no-daemon --project-dir .
    - name: Verify APK
      run: |
        ls -l app/build/outputs/apk/release/*.apk
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || $ANDROID_HOME/cmdline-tools/latest/bin/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || echo "skip verify (no build-tools path)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with: { name: alpha-control-apk, path: app/build/outputs/apk/release/app-release.apk }
